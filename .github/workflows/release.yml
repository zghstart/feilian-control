name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag
        run: make check-tag TAG="$GITHUB_REF_NAME"
      - name: Check
        run: make check
      - name: Build package
        run: make pkg
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="build/FeiLianControl-${GITHUB_REF_NAME#v}.pkg"
          gh release create "$GITHUB_REF_NAME" \
            "$pkg" \
            "$pkg.sha256" \
            --title "FeiLian Control $GITHUB_REF_NAME" \
            --generate-notes
