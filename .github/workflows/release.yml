name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: make check
      - name: Build package
        run: make pkg
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/FeiLianControl-*.pkg \
            build/FeiLianControl-*.pkg.sha256 \
            --title "FeiLian Control $GITHUB_REF_NAME" \
            --generate-notes
